    <script>
      // Gracefully handle Vite dev HMR websocket disconnects in container environment
      window.addEventListener('unhandledrejection', function (e) {
        if (
          e.reason &&
          (String(e.reason).includes('WebSocket') ||
            (e.reason.message && e.reason.message.includes('WebSocket')) ||
            (e.reason.stack && e.reason.stack.includes('client:225')))
        ) {
          e.preventDefault();
          e.stopPropagation();
        }
      });
    </script>
